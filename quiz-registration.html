<!DOCTYPE html>
<html>
<head>
    <title>Cosmos Knowledge Quiz registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #090d24, #172b50, #263d63);
            font-family: 'Poppins', sans-serif;
            color: white;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            background-color: #f4f7fc;
            color: #202d46;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(103, 159, 255, 0.3);
        }

        h2 {
            text-align: center;
            color: #172b50;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #61718a;
            margin-bottom: 25px;
        }

        .btn-custom {
            background-color: #234b83;
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background-color: #142e55;
            color: white;
        }

        label {
            font-weight: 600;
            color: #263d63;
        }

        .form-control, .form-select {
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            padding: 10px;
        }

        .form-control:focus, .form-select:focus {
            border-color: #3768a8;
            box-shadow: 0 0 5px #9bbce5;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            color: #cbd5e1;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Cosmos Knowledge Quiz Registration</h2>

        <p class="subtitle">
            Register now and explore the universe!
        </p>

        <form>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control"
                       placeholder="Enter your full name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control"
                       placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mobile Number</label>
                <input type="tel" class="form-control"
                       placeholder="Enter mobile number" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Date of Birth</label>
                <input type="date" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Gender</label><br>

                <input type="radio" name="gender"> Male
                <input type="radio" name="gender" class="ms-3"> Female
                <input type="radio" name="gender" class="ms-3"> Other
            </div>

            <div class="mb-3">
                <label class="form-label">Select Favourite Topics</label>

                <select class="form-select" required>
                    <option value="">Choose a workshop</option>
                    <option>Introduction to Astronomy</option>
                    <option>Satellite Technology</option>
                    <option>Rocket Science</option>
                    <option>Planetary Exploration</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Education Level</label>

                <select class="form-select">
                    <option>Select Education</option>
                    <option>School Student</option>
                    <option>Diploma Student</option>
                    <option>Undergraduate Student</option>
                    <option>Postgraduate Student</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Quiz Exam Date</label>
                <input type="date" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Areas of Interest</label><br>

                <input type="checkbox"> Space Science<br>
                <input type="checkbox"> Satellites<br>
                <input type="checkbox"> Mars Exploration<br>
                <input type="checkbox"> Astronomy
            </div>

            <div class="mb-3">
                <label class="form-label">Why do you want to join?</label>

                <textarea class="form-control" rows="3"
                          placeholder="Write your message"></textarea>
            </div>

            <button type="submit" class="btn-custom">
                Submit Registration
            </button>

            <button type="reset" class="btn btn-secondary w-100 mt-2">
                Reset Form
            </button>

        </form>

    </div>

    <footer>
        <p>© 2026 Space Exploration Workshop</p>
    </footer>

</body>
</html>
