<!DOCTYPE html>
<html>
<head>
    <title>Earth</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #090514;
            color: #f0e6ff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .space-container {
            width: 100%;
            max-width: 400px;
            background-color: #130b29;
            border: 2px solid #ff2a85;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 0 24px rgba(255, 42, 133, 0.35);
            animation: glowBorder 3s ease-in-out infinite alternate;
        }

        .space-image {
            display: block;
            width: 100%;
            height: 210px;
            background-color: #1d123b;
            border: 2px solid #00f5d4;
            border-radius: 10px;
            margin-bottom: 16px;
        }

        .heading-box {
            width: 100%;
            min-height: 48px;
            background-color: #1d123b;
            border: 2px solid #ff2a85;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 14px;
            align-items: center;
            box-shadow: 0 0 12px rgba(0, 245, 212, 0.2);
        }

        .heading-box h1 {
            font-size: 22px;
            color: #00f5d4;
            text-align: center;
            animation: glowText 2.2s ease-in-out infinite alternate;
        }

        .info-box {
            width: 100%;
            min-height: 110px;
            background-color: #1d123b;
            border: 2px solid #ff2a85;
            border-radius: 10px;
            padding: 14px;
        }

        .info-box p {
            font-size: 15px;
            line-height: 1.6;
            color: #f0e6ff;
        }

        @keyframes glowBorder {
            from {
                border-color: #d91e70;
                box-shadow: 0 0 16px rgba(255, 42, 133, 0.28);
            }
            to {
                border-color: #ff2a85;
                box-shadow: 0 0 28px rgba(255, 42, 133, 0.55);
            }
        }

        @keyframes glowText {
            from {
                text-shadow: 0 0 6px rgba(0, 245, 212, 0.4);
            }
            to {
                text-shadow: 0 0 16px #00f5d4, 0 0 24px #ffffff;
            }
        }
    </style>
</head>
